name: Nix CI for Rocq 9.3

on:
  pull_request:
  push:
    branches: [main, rocq-9.3]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: rocq2typst on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: f1uctus
          extraPullNames: coq, coq-community, math-comp
          authToken: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ !secrets.CACHIX_AUTH_TOKEN || github.event_name != 'push' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')) }}
      - name: Build renderer and dictionaries
        shell: bash
        run: |
          source_args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            source_url="https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA"
            source_hash=$(nix-prefetch-url --unpack --name source "$source_url")
            source_args=(--arg config "{ src = builtins.fetchTarball { url = \"$source_url\"; sha256 = \"$source_hash\"; }; }")
          fi
          for package in rocq2typst rocq2typst-mathcomp rocq2typst-analysis \
            rocq2typst-coqeal rocq2typst-infotheo; do
            nix-build --no-out-link "${source_args[@]}" --argstr bundle rocq-9.3 --argstr job "$package"
          done
